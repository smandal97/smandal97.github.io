<ul class="talks">
{% for t in include.items %}
  <li class="talk">
    <time class="talk__date" datetime="{{ t.date }}">{{ t.date | append: '-01' | date: '%b %Y' }}</time>
    <div>
      <p class="talk__event">{% if t.url %}<a href="{{ t.url }}">{{ t.event }}</a>{% else %}{{ t.event }}{% endif %}, {{ t.host }}</p>
      {% if t.note %}<p class="talk__note">{{ t.note }}</p>{% endif %}
    </div>
  </li>
{% endfor %}
</ul>

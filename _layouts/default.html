<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120A2A">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="{{ '/#research' | relative_url }}">Research</a></li>
          <li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
          <li><a href="{{ '/#talks' | relative_url }}">Talks</a></li>
          <li><a href="{{ '/#outreach' | relative_url }}">Outreach</a></li>
          <li><a class="topbar__cv" href="{{ site.author.cv | relative_url }}">CV</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p>© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
      <p><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    </div>
  </footer>
  {% if page.shell %}<script src="{{ '/assets/js/shell.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>

---
layout: default
---
<article class="article wrap">
  <p class="article__back"><a href="{{ '/#research' | relative_url }}">Back to research</a></p>
  <h1 class="article__title">{{ page.title }}</h1>
  {% if page.papers %}<div class="article__paper">
    <p>{% if page.papers.size > 1 %}Papers{% else %}Paper{% endif %}</p>
    <ul class="papers">{% for x in page.papers %}<li><a href="{{ x.url }}">{{ x.label }}</a></li>{% endfor %}</ul>
  </div>{% endif %}
  {% if page.image %}
  <figure class="article__figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
  </figure>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>

---
layout: default
---
<article class="article wrap">
  <p class="article__back"><a href="{{ '/#research' | relative_url }}">Back to research</a></p>
  <h1 class="article__title">{{ page.title }}</h1>
  {% if page.paper %}<p class="article__paper">Paper: <a href="{{ page.paper }}">{{ page.paper_label }}</a></p>{% endif %}
  {% if page.image %}
  <figure class="article__figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
  </figure>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
